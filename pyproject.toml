[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
requires-python = ">=3.12"
dependencies = [
  "anywidget>=0.9.0",
  "requests>=2.0.0",
]
name = "moutils"
readme = "README.md"
version = "0.5.0"

# For projects not using `uv`, you can install these development dependencies with:
# `pip install -e ".[dev]"`
# If you're using `uv` for development, feel free to remove this section.
[project.optional-dependencies]
dev = ["marimo"]
# Database connections (moutils.db). PostHog uses `requests` (a base dep);
# Datasette needs httpx. Install with `pip install moutils[db]`.
db = ["httpx>=0.27"]
# Native (non-browser) inference for moutils.onnx.OnnxRuntime. In the browser
# the runtime loads onnxruntime-web from a CDN, so no extra is needed there.
wasm = ["onnxruntime>=1.16.0"]

# Dependency groups (recognized by `uv`). For more details, visit:
# https://peps.python.org/pep-0735/
[dependency-groups]
dev = [
  "marimo",
  "pytest",
  # moutils.db test stack
  "httpx>=0.27",
  "responses>=0.25",
  "pytest-httpx>=0.30",
  "datasette>=0.64,<1",
  "datasette-auth-tokens>=0.3,<0.4",
  # moutils.onnx test stack
  "onnx",
  "onnxruntime>=1.16.0",
]

[tool.ruff.lint.per-file-ignores]
# This snippet is injected verbatim into an `async def _():` marimo/Pyodide
# notebook cell (see demos/cloudflare/scripts/inject_micropip.py), where
# top-level `await` is a valid execution environment. Ignore F704 here only.
"demos/cloudflare/scripts/install_local_moutils.py" = ["F704"]

[tool.marimo.runtime]
pythonpath = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
