[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
requires-python = ">=3.12"
dependencies = [
  "anywidget>=0.9.0",
  "requests>=2.0.0",
]
name = "moutils"
readme = "README.md"
version = "0.4.4"

# For projects not using `uv`, you can install these development dependencies with:
# `pip install -e ".[dev]"`
# If you're using `uv` for development, feel free to remove this section.
[project.optional-dependencies]
dev = ["marimo"]

# Dependency groups (recognized by `uv`). For more details, visit:
# https://peps.python.org/pep-0735/
[dependency-groups]
dev = ["marimo", "pytest"]

[tool.ruff.lint.per-file-ignores]
# This snippet is injected verbatim into an `async def _():` marimo/Pyodide
# notebook cell (see demos/cloudflare/scripts/inject_micropip.py), where
# top-level `await` is a valid execution environment. Ignore F704 here only.
"demos/cloudflare/scripts/install_local_moutils.py" = ["F704"]

[tool.marimo.runtime]
pythonpath = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
